name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Tests (Arch, like Omarchy)
    runs-on: ubuntu-latest
    # Pinned by digest like the actions; pacman -Syu still brings current packages.
    container: archlinux:base-20261018.0.612668@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    steps:
      - name: Install build tools
        # Arch mirrors sometimes drop a download; retry before failing.
        run: |
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed gcc pkgconf qt6-base libusb python ttf-dejavu && exit 0
            sleep 15
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python tests and QML security checks
        run: python -m unittest discover -s tests -v
      - name: Native build and self-tests
        run: python native_build.py --test
      - name: Plugin manifest
        run: python -c "import json; json.load(open('manifest.json'))"

  service-hardening:
    name: Service hardening
    runs-on: ubuntu-latest
    container: archlinux:base-20261018.0.612668@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    steps:
      - name: Install systemd tools
        # Arch mirrors sometimes drop a download; retry before failing.
        run: |
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed systemd && exit 0
            sleep 15
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The relay runs as root: fail if its sandbox loses restrictions.
      # Exposure is 0-100 (systemd shows it /10); the unit scores 7 today.
      - name: Verify and score the power relay unit
        run: |
          mkdir -p /tmp/unit
          sed 's|^ExecStart=.*|ExecStart=/usr/bin/true|' omarchy-trcc-power.service > /tmp/unit/omarchy-trcc-power.service
          systemd-analyze verify /tmp/unit/omarchy-trcc-power.service
          systemd-analyze security --offline=yes --threshold=15 --no-pager /tmp/unit/omarchy-trcc-power.service

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck (errors)
        run: shellcheck --severity=error setup.sh install.sh uninstall.sh bin/power-relay.sh

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        run: pipx run zizmor==1.31.1 --offline --min-severity=medium .github/workflows

  codeql-cpp:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-latest
    # Built in Arch, like Omarchy, so the analysis sees the real Qt 6 build.
    container: archlinux:base-20261018.0.612668@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Install build tools
        # Arch mirrors sometimes drop a download; retry before failing.
        run: |
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed gcc pkgconf qt6-base libusb python git && exit 0
            sleep 15
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build engine
        run: python native_build.py --output build
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
